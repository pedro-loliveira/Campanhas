<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Npcs</title>
    <link rel="stylesheet" href="../css/campanha.css">
</head>
<body>
<div class="site-wrapper">

    <header class="site-header" data-site-header></header>

    <main class="site-main secao">
        <div class="container content-layout">

            <div>
                <div class="page-header">
                    <span class="badge" data-campanha="nome"></span>
                    <h1>Npcs</h1>
                    <p>Npcs e figuras importantes da campanha.</p>
                </div>

                <div class="grid">
                    <!-- <a href="npc01.html" class="card">
                        <img class="card-imagem card-imagem-quadrada" src="../assets/images/Npcs/Npc-placeholder.jpg" alt="" loading="lazy" onerror="this.remove()">
                        <div class="card-corpo">
                            <h3 class="card-titulo">Nome do Npc</h3>
                            <p class="card-texto">Breve descrição do Npc.</p>
                        </div>
                    </a> -->

                    <div class="card card-em-breve">
                        <div class="card-corpo">
                            <h3 class="card-titulo">[Inserir Nome]</h3>
                            <p class="card-texto">[Inserir Descrição]</p>
                        </div>
                    </div>
                </div>
            </div>

            <aside class="painel sidebar">
                <div class="painel-titulo">Informações</div>
                <div class="info-item"><span class="info-label">Campanha</span><span class="info-value" data-campanha="nome"></span></div>
                <div class="info-item"><span class="info-label">Npcs</span><span class="info-value">1 registrado</span></div>
                <div class="info-item"><span class="info-label">Status</span><span class="badge badge-destaque" data-campanha="status"></span></div>
            </aside>

        </div>
    </main>

    <footer class="site-footer" data-site-footer></footer>

</div>

<script src="../campanha.js"></script>
<script src="../../js/main.js"></script>

</html>
