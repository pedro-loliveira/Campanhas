<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Underdark</title>
    <link rel="stylesheet" href="../css/campanha.css" />
</head>

<body>
    <!-- MODELO DE PÁGINA DE ITEM (personagem, local, facção, criatura, regra, sessão).
     Copie para <seção>/nome.html. Os caminhos já estão para UMA pasta de profundidade. -->
    <div class="site-wrapper">

        <header class="site-header" data-site-header></header>

        <main class="site-main secao">
            <div class="container content-layout-sembarra">
                <article class="prosa">
                    <div class="page-header">
                        <span class="badge" data-campanha="nome"></span>
                        <h1>Regras</h1>
                        <p>Regras específicas, sistemas e referências utilizadas durante a campanha.</p>
                        <p>
                            Nao e uma lista obrigatoria de regras, mas sim uma lista que pode ser util para jogadores e
                            mestres,
                            facilitando micro gerenciamentos ou evitando regras complexas que podem atrapalhar a fluidez
                            do jogo.
                        </p>
                    </div>

                    <!-- cards montados pelo main.js a partir de npcs/itens.json -->
                    <div class="grid" data-grid="itens.json"
                        data-imagem-padrao="../assets/images/Npcs/Npc-placeholder.jpg"></div>
            </div>

    </div>
    </main>

    <footer class="site-footer" data-site-footer></footer>

    </div>

    <script src="../campanha.js"></script>
    <script src="../../js/main.js"></script>
</body>

</html>
