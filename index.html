<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campanhas do Pero</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/componentes.css">
</head>
<body>
<div class="site-wrapper">

    <header class="site-header">
        <div class="container header-content">
            <a href="index.html" class="site-logo">Campanhas do Pero</a>
            <label class="header-search">
                <span aria-hidden="true">⌕</span>
                <input type="search" data-busca placeholder="Pesquisar campanhas..." autocomplete="off" aria-label="Pesquisar">
                <kbd>Ctrl K</kbd>
            </label>
            <button type="button" class="btn btn-pequeno" data-tema-toggle aria-label="Alternar tema">◐</button>
        </div>
    </header>

    <main class="site-main">

        <section class="hero">
            <div class="container">
                <div class="hero-content">
                    <span class="badge badge-destaque">Compêndio de campanhas</span>
                    <h1 class="hero-titulo">Campanhas do Pero</h1>
                    <p class="hero-subtitulo">
                        Um espaço para reunir, organizar e consultar
                        todas as campanhas narradas por mim.
                    </p>
                </div>
            </div>
        </section>

        <section class="secao">
            <div class="container">
                <div class="secao-titulo">
                    <h2>Campanhas</h2>
                </div>

                <div class="grid">

                    <a href="EmProd/index.html" class="card" data-item>
                        <img class="card-imagem" src="EmProd/assets/images/capa.jpg" alt="" onerror="this.remove()">
                        <div class="card-corpo">
                            <span class="card-meta">Campanha</span>
                            <h3 class="card-titulo">EmProd</h3>
                            <p class="card-texto">Campanha atualmente em andamento.</p>
                            <span class="card-link">Abrir campanha</span>
                        </div>
                    </a>

                    <!-- MODELO PARA CAMPANHA NOVA: copie o bloco acima e troque o nome da pasta, o título e o texto. -->

                </div>
            </div>
        </section>

    </main>

    <footer class="site-footer">
        <div class="footer-bottom container">
            <p>Campanhas do Pero • <span data-ano-atual></span></p>
        </div>
    </footer>

</div>

<script src="js/main.js"></script>
</body>
</html>
