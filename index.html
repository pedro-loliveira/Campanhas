<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Campanhas do Pero</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/componentes.css">
</head>

<body>

    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header class="site-header">

        <div class="header-inner">

            <a href="index.html" class="site-logo">
                CAMPANHAS DO PERO
            </a>

            <div class="header-search">
                <span class="header-search-icon">⌕</span>

                <input
                    type="search"
                    id="site-search"
                    class="header-search-input"
                    placeholder="Pesquisar..."
                    autocomplete="off"
                    aria-label="Pesquisar"
                >

                <span class="header-search-shortcut">
                    Ctrl K
                </span>
            </div>

            <button
                type="button"
                id="theme-button"
                class="theme-button"
                aria-label="Alterar tema"
                title="Alterar tema"
            >
                ◐
            </button>

        </div>

    </header>


    <!-- =====================================================
         CONTEÚDO PRINCIPAL
         ===================================================== -->

    <main class="home-page">

        <section class="home-hero">

            <div class="hero-content">

                <span class="hero-eyebrow">
                    COMPÊNDIO DE CAMPANHAS
                </span>

                <h1>
                    Campanhas do Pero
                </h1>

                <p>
                    Um espaço para reunir, organizar e consultar
                    todas as campanhas narradas por mim.
                </p>

            </div>

        </section>


        <!-- =================================================
             CAMPANHAS
             ================================================= -->

        <section class="content-section">

            <div class="section-heading">

                <div>
                    <span class="section-eyebrow">
                        ARQUIVO
                    </span>

                    <h2>
                        Campanhas
                    </h2>
                </div>

            </div>


            <div class="campaign-grid">

                <!-- =========================================
                     CAMPANHA: EMPROD
                     ========================================= -->

                <a
                    href="EmProd/index.html"
                    class="campaign-card"
                >

                    <div class="campaign-card-image">

                        <img
                            src="EmProd/assets/images/capa.jpg"
                            alt=""
                            onerror="this.style.display='none'"
                        >

                    </div>

                    <div class="campaign-card-content">

                        <span class="campaign-card-label">
                            CAMPANHA
                        </span>

                        <h3>
                            EmProd
                        </h3>

                        <p>
                            Campanha atualmente em andamento.
                        </p>

                        <span class="campaign-card-link">
                            Abrir campanha →
                        </span>

                    </div>

                </a>


                <!-- =========================================
                     MODELO PARA FUTURAS CAMPANHAS

                     Copie este bloco quando adicionar
                     uma nova campanha.
                     ========================================= -->

                <!--

                <a
                    href="Nome-Da-Campanha/index.html"
                    class="campaign-card"
                >

                    <div class="campaign-card-image">

                        <img
                            src="Nome-Da-Campanha/assets/images/capa.jpg"
                            alt=""
                        >

                    </div>

                    <div class="campaign-card-content">

                        <span class="campaign-card-label">
                            CAMPANHA
                        </span>

                        <h3>
                            Nome da Campanha
                        </h3>

                        <p>
                            Descrição da campanha.
                        </p>

                        <span class="campaign-card-link">
                            Abrir campanha →
                        </span>

                    </div>

                </a>

                -->


            </div>

        </section>

    </main>


    <!-- =====================================================
         FOOTER
         ===================================================== -->

    <footer class="site-footer">

        <p>
            Campanhas do Pero
            <span>•</span>
            <span data-current-year></span>
        </p>

    </footer>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script src="js/main.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/search.js"></script>

</body>
</html>
